# Reference GitHub Actions wrapper around scripts/build-versions.sh.
#
# Set vars.SITE_BASE in the repository settings if your site is served under
# a path prefix.
#
# This wrapper does three things on top of the portable script:
#   1. Restores a SHA-keyed artifact cache at $CACHE_DIR. The orchestrator
#      resolves each tag to its commit SHA and looks for $CACHE_DIR/<sha>/<key>/
#      before cloning, so already-built historical versions skip clone+build
#      entirely. Tags are immutable, so once cached they stay cached.
#   2. Sets up the toolchain the example builders need (Node + pnpm here).
#   3. Uploads $DIST_DIR as a Pages artifact and deploys it.
#
# Step 2 is the only generator-specific piece. If your site is Hugo-only, drop
# the pnpm/setup-node steps and replace them with `uses: peaceiris/actions-hugo@v3`.
# If it's MkDocs, swap in `actions/setup-python@v5` and a pip install. The
# cache + build + upload spine stays the same.

name: Build & deploy versioned site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  DIST_DIR: dist
  BUILD_DIR: build
  CACHE_DIR: .cache/ssm
  REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
  SITE_BASE: ${{ vars.SITE_BASE }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # SHA-keyed cache. The runner key needs to bust when CI image or tooling
      # changes; the per-tag SHAs live inside the cache directory and don't
      # belong in the cache key. Bump v1 -> v2 to invalidate the whole cache.
      - name: Restore historical-build cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CACHE_DIR }}
          key: ssm-cache-v1-${{ runner.os }}
          restore-keys: |
            ssm-cache-v1-

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install root deps
        run: pnpm install

      - name: Build all versions
        env:
          NODE_OPTIONS: --max_old_space_size=4096
        run: scripts/build-versions.sh

      # If SITE_BASE is set, the build wrote output to $DIST_DIR/$SITE_BASE/...
      # GitHub Pages serves the artifact at /<repo>/, so when SITE_BASE matches
      # the repo name, uploading $DIST_DIR/$SITE_BASE avoids a doubled prefix.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_BASE && format('{0}/{1}', env.DIST_DIR, env.SITE_BASE) || env.DIST_DIR }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
