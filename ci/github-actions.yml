# Reference GitHub Actions wrapper around scripts/build-versions.sh.
#
# Replace `your-org/your-site` with your repository slug. Set vars.SITE_BASE
# in the repository settings if your site is served under a path prefix.
#
# This wrapper does three things on top of the portable script:
#   1. Caches $DIST_DIR keyed by hash(deploy-versions.json). Historical builds
#      are immutable, so a cache hit skips them and only HEAD rebuilds.
#   2. Sets up the toolchain the example builders need (Node + pnpm here).
#   3. Uploads $DIST_DIR as a Pages artifact and deploys it.

name: Build & deploy versioned site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  DIST_DIR: dist
  BUILD_DIR: build
  REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
  SITE_BASE: ${{ vars.SITE_BASE }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore cached dist
        id: dist-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DIST_DIR }}
          key: dist-${{ hashFiles('deploy-versions.json') }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install root deps
        run: pnpm install

      - name: Build all versions
        if: steps.dist-cache.outputs.cache-hit != 'true'
        env:
          NODE_OPTIONS: --max_old_space_size=4096
        run: scripts/build-versions.sh

      - name: Build HEAD only (cache hit)
        if: steps.dist-cache.outputs.cache-hit == 'true'
        env:
          NODE_OPTIONS: --max_old_space_size=4096
          SITE_VERSION_KEY: next
          DIST_DIR: ${{ github.workspace }}/${{ env.DIST_DIR }}
        run: pnpm build

      - name: Save dist cache
        if: steps.dist-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.DIST_DIR }}
          key: dist-${{ hashFiles('deploy-versions.json') }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.DIST_DIR }}/${{ env.SITE_BASE }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
