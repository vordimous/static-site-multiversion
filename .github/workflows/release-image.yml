# Builds the all-in-one demo image (every example x every demo version,
# hosted on nginx) and pushes it to GitHub Container Registry. This is the
# deployable showcase artifact, sibling to the GitHub Pages flow in
# .github/workflows/demos.yml.

name: Release demo image

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The Dockerfile clones historical demo-* refs from the repo's own
          # .git via file://, so we need full history and all branches/tags.
          fetch-depth: 0

      - name: Materialize all remote branches locally
        run: git fetch origin '+refs/heads/*:refs/heads/*'

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
