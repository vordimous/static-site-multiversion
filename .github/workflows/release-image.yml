# Builds the all-in-one demo image (every example x every demo version,
# hosted on nginx) and pushes it to GitHub Container Registry. This is the
# deployable showcase artifact, sibling to the GitHub Pages flow in
# .github/workflows/demos.yml.

name: Release demo image

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # for creating GitHub Releases on `v*` tag pushes
  packages: write

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The Dockerfile clones historical demo-* refs from the repo's own
          # .git via file://, so we need full history and all branches/tags.
          fetch-depth: 0

      - name: Materialize all remote branches locally
        # actions/checkout with fetch-depth: 0 already fetched every remote
        # branch into refs/remotes/origin/*. We just need local heads for
        # them too so the Dockerfile's `git clone -b <branch>` against
        # file:///src can resolve them. Skip the currently-checked-out
        # branch (default is master) since git refuses to overwrite it.
        run: |
          current=$(git rev-parse --abbrev-ref HEAD)
          git for-each-ref --format='%(refname:lstrip=3)' refs/remotes/origin/ |
            grep -vE "^(HEAD|${current})$" |
            while read -r b; do
              git branch --force "$b" "origin/$b"
            done
          git branch --list

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Multi-version demo image for `${{ github.ref_name }}`.

            ```bash
            docker run --rm -p 8080:80 ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            # open http://localhost:8080/
            ```

            Other tags pushed for this build:

            - `latest` (always tracks the default branch)
            - `${{ github.ref_name }}` (this release)
            - short SHA `sha-${{ github.sha }}`

            See the [README](README.md) for the contract this image
            demonstrates and the [Dockerfile](Dockerfile) for how it's built.
