# Builds every example × every demo version via scripts/demo-all.sh and
# deploys the result to GitHub Pages. Each builder lives at
#
#   /<repo>/<builder>/<key>/...
#
# (where <repo> is the project Pages URL prefix, e.g. /static-site-multiversion/).
#
# This is the contract's full multi-version flow on Pages: the global
# demo-* timeline plus each builder's per-example tags, both axes merged
# into one canonical /<repo>/<builder>/versions.json that switcher shims
# fetch at runtime.

name: Deploy demos

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The orchestrator clones historical demo-* refs from the repo's
          # own .git via file://, so we need full history and every branch.
          fetch-depth: 0

      - name: Materialize all remote branches locally
        # actions/checkout with fetch-depth: 0 already fetched every remote
        # branch into refs/remotes/origin/*; create local heads so the
        # orchestrator's `git clone -b <branch>` can resolve them. Skip
        # the currently-checked-out branch — git refuses to overwrite it.
        run: |
          current=$(git rev-parse --abbrev-ref HEAD)
          git for-each-ref --format='%(refname:lstrip=3)' refs/remotes/origin/ |
            grep -vE "^(HEAD|${current})$" |
            while read -r b; do
              git branch --force "$b" "origin/$b"
            done

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install mkdocs
        run: pip install mkdocs

      - name: Cache historical artifact builds
        uses: actions/cache@v4
        with:
          path: .cache
          key: demo-cache-v1-${{ runner.os }}

      - name: Build all demos via orchestrator
        env:
          # Project Pages serves at /<repo>/, so every internal URL needs
          # to start with that prefix. demo-all.sh nests every builder
          # under .demo/_serve/<prefix>/<builder>/<key>/ and bakes the
          # right `base` into each example's config.
          SITE_BASE_PREFIX: ${{ github.event.repository.name }}
          CACHE_DIR: ${{ github.workspace }}/.cache
        run: scripts/demo-all.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          # The artifact's root maps to /<repo>/ on Pages, so we upload
          # the prefix subtree directly (avoiding /<repo>/<repo>/...).
          path: .demo/_serve/${{ github.event.repository.name }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
