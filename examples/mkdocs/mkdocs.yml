site_name: Versioned MkDocs Example
site_description: Demonstrates the static-site-multiversion builder contract.

# site_dir is set at build time via build.sh, not here.

theme:
  name: mkdocs

# Loaded by every page; injects the version-switcher mount + shim include
# at runtime. data-mode="baked" demonstrates the static-snapshot mode.
extra_javascript:
  - switcher-inject.js

nav:
  - Home: index.md
  - Guide: guide.md
